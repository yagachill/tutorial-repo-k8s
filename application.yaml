apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-lab-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yagachill/tutorial-repo-k8s
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
