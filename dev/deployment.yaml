apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:6a968f8a1bec314e9bad04eedb1ec801a296cf67
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
