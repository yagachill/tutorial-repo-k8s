apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:dd3b5edd2a3072549cf86d622800b7480b08b7b3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
