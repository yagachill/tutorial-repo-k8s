apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:2fda0144b9d96106663cb140cf066af32348e4b7
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
