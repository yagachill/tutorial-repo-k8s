apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:12f6a9d2f5a02a71886d1521b9f0e32b022671e2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
