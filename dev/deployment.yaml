apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:5b1a34a26c5d23f5694dbc7f604b91c2d327a5f5
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
