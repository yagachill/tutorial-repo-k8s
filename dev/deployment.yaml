apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:d1fcda4c4ee0b8d48f4623fbe33fddb6d4d5c60b
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
