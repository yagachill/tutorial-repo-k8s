apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:3f4f99422fbd5be1c6fd1eeb6d4659e7341e5e28
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
