apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:2b707b842945d07c81cdebb5327dc54cd700e6f7
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
