apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:05b53438d419fb0eb08626cfb6978319132c97a9
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
