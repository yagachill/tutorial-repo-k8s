apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:61ca894e2419be5dceed5f5eda54bd81a1c6639b
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
