apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:59368ca14d5ca41146c34a1554323b693d858f7f
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
