apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:05df7269733b18dc246811ff7ae692d654f8d6e3
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
