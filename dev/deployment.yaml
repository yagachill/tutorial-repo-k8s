apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:49227ced4f2f0e57e4f6e0e8ad0bcfc51d1f6ec8
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
