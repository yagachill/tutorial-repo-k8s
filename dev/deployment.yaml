apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:52087b284fc062e7651c3e379a3a9bee9b5b8396
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
