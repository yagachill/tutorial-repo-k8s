apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:c14d1fc9fe9d2d258ba02c5755fd521d66bef9a7
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
