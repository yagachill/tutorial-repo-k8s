apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:7a113880118890906f9faec213b3a2c2ecd0b38e
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
