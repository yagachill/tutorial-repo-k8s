apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:3bc9a3ba697fbced3611f409f0056525a7c196d8
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
