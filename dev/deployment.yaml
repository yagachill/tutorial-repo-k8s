apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/yagachill/docker-lab:e8054a22ec5961ffd5a999fa9061919da9ac7882
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
